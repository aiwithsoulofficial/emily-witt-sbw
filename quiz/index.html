<body>
<style>
  :root{
    --bg:#F7F3EF; --bg-alt:#F7E6D3; --dark:#2B1E1E; --dark-2:#522C1F;
    --blush:#E4B5C1; --blush-light:#EDD0D7; --blush-deep:#C4899A;
    --gold:#E8C275; --gold-deep:#D4A24A; --taupe:#C4B19E;
    --line:rgba(43,30,30,.12); --card:#FFFDFB;
    --serif:'Playfair Display', Georgia, 'Times New Roman', serif;
    --sans:'Work Sans', -apple-system, 'Helvetica Neue', sans-serif;
    --maxw:640px;
  }
  *{box-sizing:border-box}
  #sbw-quiz{
    background:var(--bg); color:var(--dark); font-family:var(--sans);
    font-weight:300; line-height:1.6; min-height:100vh;
    display:flex; flex-direction:column; align-items:center;
    padding:clamp(20px,5vw,64px) 20px; -webkit-font-smoothing:antialiased;
  }
  #sbw-quiz .wrap{width:100%; max-width:var(--maxw); margin:0 auto}

  /* brand mark */
  #sbw-quiz .logo{display:block; width:clamp(150px,34vw,192px); height:auto;
    margin:0 auto clamp(22px,5vw,42px)}

  /* progress */
  #sbw-quiz .progress{display:flex; align-items:center; gap:14px; margin-bottom:clamp(28px,6vw,44px)}
  #sbw-quiz .progress-track{flex:1; height:3px; background:var(--line); border-radius:2px; overflow:hidden}
  #sbw-quiz .progress-fill{height:100%; width:0; border-radius:2px;
    background:linear-gradient(90deg,var(--blush),var(--gold)); transition:width .5s ease}
  #sbw-quiz .progress-label{font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--dark-2); font-weight:400; white-space:nowrap;
    font-variant-numeric:tabular-nums}

  /* screens */
  #sbw-quiz .screen{animation:fade .5s ease both}
  @keyframes fade{from{opacity:0; transform:translateY(10px)} to{opacity:1; transform:none}}
  @media (prefers-reduced-motion:reduce){
    #sbw-quiz .screen{animation:none}
    #sbw-quiz .progress-fill{transition:none}
  }

  /* type */
  #sbw-quiz h1{font-family:var(--serif); font-weight:500; font-size:clamp(30px,7vw,46px);
    line-height:1.1; text-wrap:balance; margin:0 0 22px; text-align:center; letter-spacing:-.01em}
  #sbw-quiz h2{font-family:var(--serif); font-weight:500; font-size:clamp(23px,5vw,32px);
    line-height:1.22; text-wrap:balance; margin:0 0 30px; text-align:center; letter-spacing:-.005em}
  #sbw-quiz .lede{font-size:clamp(16px,2.4vw,18px); text-align:center; max-width:34em; margin:0 auto 38px; color:var(--dark-2)}

  /* answers */
  #sbw-quiz .answers{display:flex; flex-direction:column; gap:12px}
  #sbw-quiz .answer{
    text-align:left; width:100%; background:var(--card); border:1px solid var(--line);
    border-radius:14px; padding:18px 20px; font-family:var(--sans); font-weight:400;
    font-size:16px; color:var(--dark); cursor:pointer; line-height:1.45;
    transition:border-color .2s ease, background .2s ease, transform .12s ease;
    display:flex; align-items:center; gap:14px;
  }
  #sbw-quiz .answer .dot{flex:0 0 auto; width:18px; height:18px; border-radius:50%;
    border:1.5px solid var(--blush-deep); transition:background .2s ease, box-shadow .2s ease}
  #sbw-quiz .answer:hover{border-color:var(--blush-deep); background:#fff; transform:translateY(-1px)}
  #sbw-quiz .answer:focus-visible{outline:2px solid var(--blush-deep); outline-offset:2px}
  #sbw-quiz .answer.sel{border-color:var(--blush-deep); background:var(--blush-light)}
  #sbw-quiz .answer.sel .dot{background:var(--blush-deep); box-shadow:inset 0 0 0 3px var(--blush-light)}

  /* buttons */
  #sbw-quiz .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:10px;
    border:none; cursor:pointer; font-family:var(--sans); font-weight:500; font-size:16px;
    padding:16px 34px; border-radius:40px; color:var(--dark);
    background:linear-gradient(135deg,#E4B5C1 0%,#EDD0D7 50%,#E8C275 100%);
    transition:transform .15s ease, box-shadow .25s ease; letter-spacing:.01em;
    box-shadow:0 6px 20px rgba(196,137,154,.28);
  }
  #sbw-quiz .btn:hover{transform:translateY(-2px); box-shadow:0 10px 28px rgba(196,137,154,.36)}
  #sbw-quiz .btn:focus-visible{outline:2px solid var(--dark); outline-offset:3px}
  #sbw-quiz .btn[disabled]{opacity:.4; cursor:not-allowed; transform:none; box-shadow:none}
  #sbw-quiz .btn-row{display:flex; justify-content:center; margin-top:36px}
  #sbw-quiz .back{background:none; border:none; color:var(--dark-2); font-family:var(--sans);
    font-size:14px; cursor:pointer; margin-top:22px; opacity:.75; letter-spacing:.02em}
  #sbw-quiz .back:hover{opacity:1; text-decoration:underline; text-underline-offset:3px}
  #sbw-quiz .center{text-align:center}

  /* form */
  #sbw-quiz .field{display:flex; flex-direction:column; gap:8px; margin-bottom:18px; text-align:left}
  #sbw-quiz label{font-size:13px; letter-spacing:.08em; text-transform:uppercase; color:var(--dark-2); font-weight:500}
  #sbw-quiz input{
    font-family:var(--sans); font-size:16px; font-weight:300; color:var(--dark);
    background:var(--card); border:1px solid var(--line); border-radius:12px; padding:15px 16px;
  }
  #sbw-quiz input:focus{outline:none; border-color:var(--blush-deep); box-shadow:0 0 0 3px var(--blush-light)}
  #sbw-quiz .privacy{font-size:13px; color:var(--dark-2); text-align:center; margin-top:6px; opacity:.8}

  /* result */
  #sbw-quiz .orb{position:relative; width:clamp(164px,45vw,212px); height:clamp(164px,45vw,212px);
    border-radius:50%; margin:0 auto 8px;
    box-shadow:0 20px 46px rgba(43,30,30,.22), inset 0 -16px 34px rgba(43,30,30,.22), inset 0 14px 30px rgba(255,255,255,.4);}
  #sbw-quiz .orb::after{content:""; position:absolute; top:11%; left:15%; width:38%; height:30%; border-radius:50%;
    background:radial-gradient(circle at 42% 42%, rgba(255,255,255,.7), rgba(255,255,255,0) 68%); filter:blur(1.5px);}
  #sbw-quiz .orb::before{content:""; position:absolute; inset:0; border-radius:50%;
    background:radial-gradient(circle at 70% 78%, rgba(43,30,30,.18), rgba(43,30,30,0) 55%);}
  #sbw-quiz .eyebrow{text-align:center; font-family:var(--sans); font-weight:600; letter-spacing:.24em;
    text-transform:uppercase; font-size:12px; color:var(--dark-2); margin:26px 0 4px}
  #sbw-quiz .tagline{font-family:var(--serif); font-style:italic; font-weight:400; text-align:center;
    font-size:clamp(19px,3.2vw,23px); line-height:1.35; color:var(--dark); margin:0 auto 26px; max-width:24em}
  #sbw-quiz .result-body p{margin:0 auto 16px; max-width:34em; text-align:center; color:var(--dark-2)}
  #sbw-quiz .whisper{text-align:center; font-family:var(--serif); font-style:italic; color:var(--blush-deep); margin:6px auto 0}

  /* audit card */
  #sbw-quiz .audit{
    margin-top:44px; background:var(--bg-alt); border:1px solid rgba(212,162,74,.35);
    border-radius:20px; padding:clamp(26px,5vw,40px); text-align:center;
  }
  #sbw-quiz .audit .hair{width:44px; height:1px; background:var(--gold-deep); margin:0 auto 22px}
  #sbw-quiz .audit h3{font-family:var(--serif); font-weight:500; font-size:clamp(21px,4vw,27px); margin:0 0 16px; text-wrap:balance}
  #sbw-quiz .audit p{max-width:32em; margin:0 auto 14px; color:var(--dark-2); font-size:15.5px}
  #sbw-quiz .price{font-family:var(--serif); font-size:15px; color:var(--dark); margin:22px 0 6px; letter-spacing:.02em}
  #sbw-quiz .price b{font-weight:600}
  #sbw-quiz .turnaround{font-size:13px; letter-spacing:.06em; text-transform:uppercase; color:var(--gold-deep); font-weight:500; margin-bottom:22px}
  #sbw-quiz .signoff{font-family:var(--serif); font-style:italic; text-align:center; color:var(--dark-2); margin-top:40px}

  #sbw-quiz .restart{display:block; margin:26px auto 0; background:none; border:none; color:var(--dark-2);
    font-size:13px; letter-spacing:.08em; text-transform:uppercase; cursor:pointer; opacity:.7}
  #sbw-quiz .restart:hover{opacity:1}
</style>

      ["They think I'm lazy, but I'm just overwhelmed.","scattered"],
      ["They think I'm cold, but I'm just shut down inside.","numb"],
      ["They think I'm chill, but I'm emotionally overloaded.","overgiver"],
      ["They think I'm strong, but I'm quietly falling apart.","pretender"],
      ["They think I'm calm, but I'm restless and wired.","chaos"],
      ["They think I'm fine, but I'm completely disconnected.","hollow"],
      ["They think I'm tired, but I'm beyond exhausted.","body"]]},
    {q:"What would feel most supportive for you right now?", a:[
      ["Having someone notice without me needing to explain.","pretender"],
      ["Feeling like I'm not behind or broken for struggling.","scattered"],
      ["A space where I don't have to fix or help anyone.","overgiver"],
      ["Learning to stop feeling unsafe or guilty.","chaos"],
      ["Rest that actually feels restful.","body"],
      ["Doing something that brings joy without pressure to perform.","hollow"],
      ["Letting myself feel things without pushing them away.","numb"]]}
  ];

  // ---- Results --------------------------------------------------------------
  var ORDER = ["overgiver","scattered","body","hollow","pretender","numb","chaos"];
  var R = {
    overgiver:{name:"The Overgiver",
      orb:"radial-gradient(circle at 32% 26%, #F2F5FC 0%, #C7D2F0 30%, #9FB0E2 62%, #6E82C4 100%)",
      tag:"You give and give - but almost always at the cost of your own needs.",
      body:["You are the one everyone leans on. Capable, generous, the person who holds it all together, and quietly running yourself into the ground doing it. Saying no feels almost dangerous, so you don't.",
            "This does not mean you are too much, or not enough. It means your care has had nowhere to land but everyone else. The work is letting some of it come back to you."]},
    scattered:{name:"The Scattered Soul",
      orb:"radial-gradient(circle at 32% 26%, #F0EEF8 0%, #C1BDDE 32%, #948FC0 62%, #635C97 100%)",
      tag:"Your mind feels foggy and fractured - like too many tabs open at once.",
      body:["You used to be sharp. Now you cannot find the thought that is making all the noise, and simple decisions feel strangely hard. You are not lazy and you are not losing it.",
            "This is what happens when you have carried more than any one person should, for longer than anyone noticed. It settles once your body finally has somewhere safe to slow down."]},
    body:{name:"The Burn-Out Body",
      orb:"radial-gradient(circle at 33% 26%, #F6EAD7 0%, #DEC4A2 32%, #BE9A6E 62%, #8F6A42 100%)",
      tag:"Your body is asking for rest - not just sleep, but true restoration.",
      body:["You have overridden the signals for so long you barely hear them now. The tiredness sleep does not touch. The tight chest. The sense that your body keeps asking for something you promise it later.",
            "You are not weak for needing rest. You are someone who has been strong for too long without a break. This is where you start giving some of it back."]},
    hollow:{name:"The Hollow Achiever",
      orb:"radial-gradient(circle at 32% 26%, #EFF4EC 0%, #BFD4C6 30%, #A9C2C4 55%, #E0B355 100%)",
      tag:"You are functioning, but it feels like you're on autopilot.",
      body:["From the outside it looks handled. The list gets done, the standards get met, and underneath it all is a flatness you cannot quite explain, or admit to anyone.",
            "You are not ungrateful. You are performing a version of your life instead of living it, and some part of you already knows it. That part is worth listening to."]},
    pretender:{name:"The Protective Pretender",
      orb:"radial-gradient(circle at 34% 26%, #FBECEF 0%, #EEC3CE 30%, #DB9DAE 60%, #B87189 100%)",
      tag:"You keep it together for everyone else, even when you're falling apart inside.",
      body:["You are the strong one, the fine one, the one who has it handled, and almost no one knows what that costs you. Holding it together has become so automatic you barely notice you are doing it.",
            "You learned to stay safe by looking okay. It kept you going. It also left you alone with the truth. You are allowed to put some of that weight down."]},
    numb:{name:"The Numb One",
      orb:"radial-gradient(circle at 32% 26%, #F1EBF8 0%, #CDB9E4 32%, #A585C9 62%, #7A57A6 100%)",
      tag:"You don't feel much of anything, and if you're honest, that scares you.",
      body:["You go through the motions and wait to feel like yourself again. The numbness unsettles you more than the sadness ever did, and you are not sure how to explain it.",
            "This is not coldness and it is not who you are. It is the part of you that went quiet to get you through. It comes back slowly and gently, once it feels safe to."]},
    chaos:{name:"The Chaos Chaser",
      orb:"radial-gradient(circle at 33% 26%, #FCE7C9 0%, #F0B37A 30%, #DC7C4A 60%, #B23F2C 100%)",
      tag:"You're always on the go, because the moment you stop, something catches up.",
      body:["You are always moving, always onto the next thing. Busy feels like safety and stillness feels like a threat, so you keep the pace up even when you are exhausted.",
            "You are not scattered or unable to relax. You are outrunning something that only quiets when you finally let yourself pause. That is where the noise settles."]}
  };

  // ---- State + rendering ----------------------------------------------------
  var stage=document.getElementById('stage');
  var progress=document.getElementById('progress');
  var pfill=document.getElementById('pfill');
  var plabel=document.getElementById('plabel');
  var answers=new Array(Q.length).fill(null);
  var step=-1; // -1 intro, 0..n-1 questions, n email, n+1 result
  var lead={name:"",email:""};

  function setProgress(i){
    if(i<0||i>=Q.length){progress.hidden=true; return;}
    progress.hidden=false;
    pfill.style.width=((i+1)/Q.length*100)+'%';
    plabel.textContent=(i+1)+' / '+Q.length;
  }
  function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

  function renderIntro(){
    setProgress(-1);
    stage.innerHTML=
      '<div class="screen center">'+
        '<h1>What patterns are keeping you stuck?</h1>'+
        '<p class="lede">Uncover the quiet patterns and behaviours keeping you stuck and worn down. Because naming what is wearing you out is the first step to changing it.</p>'+
        '<div class="btn-row"><button class="btn" id="start">Start the quiz &rarr;</button></div>'+
        '<p class="privacy">7 questions - about two minutes.</p>'+
      '</div>';
    document.getElementById('start').onclick=function(){go(0)};
  }

  function renderQuestion(i){
    setProgress(i);
    var item=Q[i];
    var html='<div class="screen"><h2>'+esc(item.q)+'</h2><div class="answers">';
    item.a.forEach(function(opt,idx){
      var sel=answers[i]===idx?' sel':'';
      html+='<button class="answer'+sel+'" data-idx="'+idx+'"><span class="dot"></span><span>'+esc(opt[0])+'</span></button>';
    });
    html+='</div>';
    if(i>0) html+='<div class="center"><button class="back" id="back">&larr; Back</button></div>';
    html+='</div>';
    stage.innerHTML=html;
    Array.prototype.forEach.call(stage.querySelectorAll('.answer'),function(b){
      b.onclick=function(){
        answers[i]=parseInt(b.getAttribute('data-idx'),10);
        setTimeout(function(){ i<Q.length-1?go(i+1):go(Q.length); },220);
      };
    });
    var bk=document.getElementById('back'); if(bk) bk.onclick=function(){go(i-1)};
  }

  function renderEmail(){
    setProgress(-1);
    stage.innerHTML=
      '<div class="screen center">'+
        '<h2>Your pattern is ready.</h2>'+
        '<p class="lede">Tell me where to send it, and I will keep a copy in your inbox along with a first gentle step for your pattern.</p>'+
        '<div style="max-width:400px;margin:0 auto">'+
          '<div class="field"><label for="q-name">First name</label><input id="q-name" type="text" autocomplete="given-name" placeholder="Your first name"></div>'+
          '<div class="field"><label for="q-email">Email</label><input id="q-email" type="email" autocomplete="email" placeholder="you@example.com"></div>'+
          '<div class="btn-row" style="margin-top:24px"><button class="btn" id="reveal" disabled>Show me my pattern &rarr;</button></div>'+
          '<p class="privacy">No spam. Just your result and the occasional note from me. Em x</p>'+
        '</div>'+
        '<div class="center"><button class="back" id="back">&larr; Back</button></div>'+
      '</div>';
    var name=document.getElementById('q-name'), email=document.getElementById('q-email'), rev=document.getElementById('reveal');
    function check(){
      var ok=name.value.trim().length>0 && /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email.value.trim());
      rev.disabled=!ok;
    }
    name.oninput=check; email.oninput=check;
    rev.onclick=function(){
      lead.name=name.value.trim(); lead.email=email.value.trim();
      if(GHL_WEBHOOK){
        try{ fetch(GHL_WEBHOOK,{method:"POST",mode:"no-cors",headers:{"Content-Type":"application/json"},
          body:JSON.stringify({first_name:lead.name,email:lead.email,inner_pattern:R[tally()].name,quiz:"inner-patterns"})}); }catch(e){}
      }
      go(Q.length+1);
    };
    document.getElementById('back').onclick=function(){go(Q.length-1)};
  }

  function tally(){
    var c={}; ORDER.forEach(function(k){c[k]=0});
    answers.forEach(function(idx,qi){ if(idx!=null){ c[Q[qi].a[idx][1]]++; } });
    var best=ORDER[0];
    ORDER.forEach(function(k){ if(c[k]>c[best]) best=k; });
    return best;
  }

  function renderResult(){
    setProgress(-1);
    var key=tally(), r=R[key];
    var bodyHtml=r.body.map(function(p){return '<p>'+esc(p)+'</p>'}).join('');
    var greet=lead.name?('<p class="lede" style="margin-bottom:6px">'+esc(lead.name)+', here is what is running the show.</p>'):'';
    stage.innerHTML=
      '<div class="screen">'+
        greet+
        '<div class="orb" style="background:'+r.orb+'" role="img" aria-label="'+esc(r.name)+'"></div>'+
        '<div class="eyebrow">You’re</div>'+
        '<h1 style="margin-bottom:18px">'+esc(r.name)+'</h1>'+
        '<p class="tagline">'+esc(r.tag)+'</p>'+
        '<div class="result-body">'+bodyHtml+'</div>'+
        '<p class="whisper">Growth starts with reconnecting with yourself.</p>'+
        '<div class="audit">'+
          '<div class="hair"></div>'+
          '<h3>If this landed, the next step is getting specific.</h3>'+
          '<p>The Pattern Audit is a personalised written review. You tell me what has actually been going on, what you have tried, where you keep getting stuck and what you want instead.</p>'+
          '<p>I read your responses myself and send back a written audit - the patterns I am noticing, where your body may be sitting, and practical next steps you can start straight away.</p>'+
          '<p class="price">Your Pattern Audit - <b>$'+AUDIT_PRICE+' AUD</b></p>'+
          '<p class="turnaround">In your inbox within 24 - 48 hours</p>'+
          '<a class="btn" href="'+PAYWALL_URL+'" target="_blank" rel="noopener">Get my Pattern Audit &rarr;</a>'+
        '</div>'+
        '<p class="signoff">Em x</p>'+
        '<button class="restart" id="restart">Retake the quiz</button>'+
      '</div>';
    document.getElementById('restart').onclick=function(){
      answers=new Array(Q.length).fill(null); go(-1);
    };
  }

  function go(s){ step=s;
    if(s<0) renderIntro();
    else if(s<Q.length) renderQuestion(s);
    else if(s===Q.length) renderEmail();
    else renderResult();
    if(typeof stage.scrollIntoView==='function'){ window.scrollTo({top:0,behavior:'smooth'}); }
  }
  go(-1);
})();
</script>
